<!-- =====================================================
     SHIPPING JAVASCRIPT
====================================================== -->

<script>

(function () {

    const sameAddress =
        document.getElementById(
            "ship-to-same-address-checkbox"
        );

    const differentAddress =
        document.getElementById(
            "ship-to-different-address-checkbox"
        );

    const shippingAddress =
        document.getElementById(
            "shippingAddress"
        );


    if (
        !sameAddress ||
        !differentAddress ||
        !shippingAddress
    ) {
        return;
    }



    /* =============================================
       SHIPPING REQUIRED FIELDS
    ============================================= */

    const requiredShippingFields = [

        "shipping_first_name",
        "shipping_last_name",
        "shipping_country",
        "shipping_address_1",
        "shipping_city",
        "shipping_state",
        "shipping_postcode"

    ];



    function setShippingRequired(required) {

        requiredShippingFields.forEach(
            function (id) {

                const input =
                    document.getElementById(id);

                if (!input) {
                    return;
                }


                if (required) {

                    input.setAttribute(
                        "required",
                        "required"
                    );

                } else {

                    input.removeAttribute(
                        "required"
                    );

                }

            }
        );

    }



    /* =============================================
       USE SAME BILLING ADDRESS
    ============================================= */

    function useSameAddress() {

        sameAddress.checked = true;

        differentAddress.checked = false;

        shippingAddress.style.display =
            "none";

        setShippingRequired(false);

    }



    /* =============================================
       USE DIFFERENT SHIPPING ADDRESS
    ============================================= */

    function useDifferentAddress() {

        sameAddress.checked = false;

        differentAddress.checked = true;

        shippingAddress.style.display =
            "block";

        setShippingRequired(true);

    }



    /* =============================================
       SAME ADDRESS CLICK
    ============================================= */

    sameAddress.addEventListener(
        "change",
        function () {

            if (this.checked) {

                useSameAddress();

            } else {

                useDifferentAddress();

            }

        }
    );



    /* =============================================
       DIFFERENT ADDRESS CLICK
    ============================================= */

    differentAddress.addEventListener(
        "change",
        function () {

            if (this.checked) {

                useDifferentAddress();

            } else {

                useSameAddress();

            }

        }
    );



    /* INITIAL STATE */

    useSameAddress();

})();

</script>
