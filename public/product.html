<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Jhustin Hall</title><link rel="stylesheet" href="css/bootstrap.min.css"><link rel="stylesheet" href="css/style.css"></head><body><div id="header"></div><main class="container" style="padding:70px 15px"><div id="product"><p>Loading product…</p></div></main><div id="footer"></div><script src="js/components.js"></script><script src="js/store-data.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');const r=await fetch('/api/products/'+encodeURIComponent(id||''));if(!r.ok){product.innerHTML='<h2>Product not found</h2>';return}const p=await r.json();product.innerHTML=`<div class="row"><div class="col-md-6"><img src="${p.image}" alt="" style="max-width:100%"></div><div class="col-md-6"><h1>${p.name}</h1><h3>${Store.money(p.price,p.currency)}</h3><p>${p.description||''}</p><label>Quantity <input id="qty" type="number" min="1" max="20" value="1" style="width:80px"></label><br><br><button class="btn yellow" id="add">Add to Cart</button> <button class="btn yellow" id="buy">Buy Now</button></div></div>`;add.onclick=()=>{Store.add(p.id,+qty.value||1);location.href='cart.html'};buy.onclick=()=>{Store.add(p.id,+qty.value||1);location.href='checkout.html'};})();
</script></body></html>
