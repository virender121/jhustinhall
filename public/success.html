<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed | Jhustin Hall</title><link rel="stylesheet" href="css/bootstrap.min.css"><link rel="stylesheet" href="css/style.css"></head><body><div id="header"></div><main class="container" style="padding:90px 15px;text-align:center"><h1>Thank you for your order!</h1><p>Your PayPal payment was completed successfully.</p><p id="number"></p><p id="status"></p><a class="btn yellow" href="store.html">Continue Shopping</a></main><div id="footer"></div><script src="js/components.js"></script><script src="js/store-data.js"></script><script>(async()=>{const n=new URLSearchParams(location.search).get('order');if(!n)return;number.textContent='Order: '+n;const r=await fetch('/api/orders/'+encodeURIComponent(n));if(r.ok){const o=await r.json();status.textContent=`Status: ${o.status} • Total: ${Store.money(o.total,o.currency)}`;if(o.status==='PAID')localStorage.removeItem('jh_cart')}})();</script></body></html>
